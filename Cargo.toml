[package]
name = "harview"
version = "0.1.0"
authors = ["sheepla", "Mike Wagstaffe"]
license = "MIT"
edition = "2021"
# Highest minimum among the dependencies (`time`, `plist`); older toolchains get a clear error
rust-version = "1.88"
description = "HTTP Archive (HAR) viewer for the terminal"
repository = "https://github.com/mikew79/harview"
readme = "README.md"

[dependencies]
anyhow = "1.0.86"
base64 = "0.23.1"
byte-unit = "5.1.4"
clap = { version = "4.5.9", features = ["derive"] }
crossterm = { version = "0.27.0", features = ["event-stream"] }
flate2 = "1.1.10"
futures = "0.3.30"
mime = "0.3.17"
quick-xml = "0.42.0"
ratatui = { version = "0.26.0", features = ["unstable-rendered-line-info"] }
regex = "1.13.1"
serde = { version = "1.0.203", features = ["derive"] }
serde_derive = "1.0.203"
serde_json = "1.0.117"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.35.1", features = ["full"] }
# Same version ratatui uses; measures characters when hard-wrapping long lines
unicode-width = "0.1.13"
url = "2.5.1"
